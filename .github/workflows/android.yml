name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Check out Yggdrasil
      uses: actions/checkout@v4
      with:
        repository: yggdrasil-network/yggdrasil-go
        path: yggdrasil-go
        ref: master
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        ~/go/bin/gomobile init

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: false

    - name: Build Yggdrasil Go library
      run: |
        mkdir -p app/libs
        cd yggdrasil-go
        PATH=$PATH:~/go/bin/ ./contrib/mobile/build -a
        cp yggdrasil.aar yggdrasil-sources.jar ../app/libs
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Build and sign APK
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/yggdrasilmod.jks
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/yggdrasilmod.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yggdrasilmod-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
